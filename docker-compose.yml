# Shared definition for every container that runs the Laravel code base
# (php-fpm + background processes). One image, different commands.
x-laravel: &laravel
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: laravel-testing-lab-app:latest
  restart: unless-stopped
  working_dir: /var/www
  env_file:
    - .env.docker
  volumes:
    - .:/var/www
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  networks:
    - laravel
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *laravel
    container_name: laravel_app

  # ── Background processes (Task03) ─────────────────────────────────────────
  # Each one is a separate container so it can be restarted, scaled and
  # monitored on its own: the "one process per container" rule.

  # Queue workers. Horizon starts and supervises the worker pools defined in
  # config/horizon.php (supervisor-1 = app queues, lab = experiments).
  horizon:
    <<: *laravel
    container_name: laravel_horizon
    command: php artisan horizon
    # On `docker compose stop`, SIGTERM lets Horizon finish the jobs it is
    # running (up to the 60 s job timeout) before exiting.
    stop_signal: SIGTERM
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Runs routes/console.php schedules (horizon:snapshot, pruning) every minute.
  scheduler:
    <<: *laravel
    container_name: laravel_scheduler
    command: php artisan schedule:work

  # Feeds Pulse's "Servers" card (CPU, memory, disk) every few seconds.
  pulse:
    <<: *laravel
    container_name: laravel_pulse
    command: php artisan pulse:check

  nginx:
    image: nginx:1.25-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - laravel
    depends_on:
      - app

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: laravel_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
