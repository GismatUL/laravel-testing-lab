; Task03 – PHP-FPM status page for php-fpm_exporter.
;
; Answered by PHP-FPM itself over FastCGI on port 9000 (not through nginx),
; so it is only reachable from the Docker network. Shows active/idle
; workers, the listen queue (requests waiting for a free worker) and
; "max children reached" – the classic "site is slow but CPU is idle" cause.
[www]
pm.status_path = /fpm-status
ping.path = /fpm-ping
