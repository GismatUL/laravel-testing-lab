# Task03 – internal listener for Prometheus.
#
# Port 8080 is NOT in the `ports:` list of docker-compose.yml, so it is only
# reachable from containers on the `laravel` Docker network (Prometheus),
# never from the host or the internet.
#
# It serves exactly one URL. METRICS_INTERNAL=1 tells Laravel that the
# request came through this listener (see EnsureInternalMetricsRequest).
server {
    listen 8080;
    server_name _;
    root /var/www/public;

    access_log off;

    location = /metrics {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param METRICS_INTERNAL 1;
    }

    location / {
        return 404;
    }
}
